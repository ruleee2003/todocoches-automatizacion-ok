name: Actualizar precios de combustible

on:
  schedule:
    - cron: '30 6 * * *'   # cada día, sobre las 7:30-8:30 en España
  workflow_dispatch:       # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Descargar los datos del Ministerio
        run: |
          URL="https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/"
          OPC="--fail --silent --show-error --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors -H Accept:application/json -o datos-ministerio.json"
          if curl $OPC "$URL"; then
            echo "Descarga correcta"
          else
            echo "Primer intento fallido: se añade el certificado intermedio de DigiCert y se detalla la conexión"
            curl --fail --silent --show-error -o intermedio.crt "http://cacerts.digicert.eu/DigiCertG2TLSEURSA4096SHA3842022CA1.crt"
            openssl x509 -inform DER -in intermedio.crt -out intermedio.pem || cp intermedio.crt intermedio.pem
            cat /etc/ssl/certs/ca-certificates.crt intermedio.pem > certificados.pem
            curl --verbose --cacert certificados.pem $OPC "$URL"
          fi
          ls -l datos-ministerio.json

      - name: Descargar el precio de la luz
        run: |
          HOY=$(TZ=Europe/Madrid date +%F)
          if ! curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors -H Accept:application/json -o datos-luz.json "https://api.esios.ree.es/archives/70/download_json?locale=es&date=$HOY"; then
            rm -f datos-luz.json
            echo "::warning::No se ha podido descargar el precio de la luz; se mantiene el último dato."
          fi

      - name: Generar los archivos de precios
        shell: pwsh
        run: ./scripts/actualizar-precios.ps1 -Entrada datos-ministerio.json -OutDir salida -HistoricoPath datos/precios-historico.json -EntradaLuz datos-luz.json -LuzHistoricoPath datos/luz-historico.json -LuzInicial scripts/luz-historico-inicial.json -HistProvinciasPath datos/provincias-historico.json
      - name: Subir solo los dos archivos JSON a IONOS
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; cd \"${SFTP_PATH:-/}\"; lcd salida; put precios.json; put precios-historico.json; bye"

      - name: Guardar el histórico en el repositorio
        run: |
          git config user.name "todocoches-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Precios del $(date +%F)"
          git push

      # Va al final a propósito: si fallara, los precios ya están publicados y el histórico, guardado.
      - name: Descargar las páginas publicadas
        run: |
          mkdir -p web-entrada
          for f in index.html precio-gasolina-hoy.html precio-gasolina-madrid.html precio-gasolina-barcelona.html precio-gasolina-valencia.html precio-gasolina-sevilla.html precio-gasolina-zaragoza.html sitemap.xml; do
            curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 10 -o "web-entrada/$f" "https://todocoches.org/$f?v=$(date +%s)" || rm -f "web-entrada/$f"
          done

      - name: Escribir los precios del día en las páginas
        shell: pwsh
        run: ./scripts/actualizar-paginas.ps1 -Salida salida -Historico datos/precios-historico.json -HistProvincias datos/provincias-historico.json -WebEntrada web-entrada -WebSalida web-salida

      - name: Subir las páginas a IONOS
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          {
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 2"
            echo "set net:timeout 30"
            echo "set cmd:fail-exit yes"
            echo "cd \"${SFTP_PATH:-/}\""
            echo "lcd web-salida"
            for f in web-salida/*; do echo "put \"$(basename "$f")\""; done
            echo "bye"
          } > paginas.lftp
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "source paginas.lftp"
